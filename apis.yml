aid: retro-biosciences
name: Retro Biosciences
description: 'Retro Biosciences is a Redwood City, California longevity biotechnology
  company founded in 2021 whose stated mission is to add ten years to healthy human
  lifespan. Its published preclinical pipeline spans RTR242, a small-molecule autophagy-flux
  booster aimed at Alzheimer''s disease; RTR888, iPSC-derived microglial progenitors
  for CNS conditions; RTR890, iPSC-derived hematopoietic stem cells for blood disorders;
  AAV-delivered in vivo tissue reprogramming for osteoarthritis and age-related hearing
  loss; and AI-designed protein therapeutics, the last built on a 2025 collaboration
  with OpenAI on a protein-engineering model for reprogramming factors. Retro was
  seeded with $180M from Sam Altman and reported a $1.8B valuation in 2026. It is
  a therapeutics company rather than a software company: it operates a public GitHub
  organization of internal lab-automation and bioinformatics tooling, but publishes
  no API, SDK, developer portal or machine-readable contract of any kind.'
